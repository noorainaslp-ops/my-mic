<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Mic Transmitter - Balanced</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #2dd4bf;
            --text: #f8fafc;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        #visualizer {
            width: 100%;
            height: 120px;
            background: #020617;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start { background: var(--accent); color: #0f172a; }
        .btn-stop { background: #ef4444; color: #ffffff; }
        .controls { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .label-group { display: flex; flex-direction: column; }
        .label-main { font-weight: 600; font-size: 0.95rem; }
        .label-sub { font-size: 0.75rem; color: #94a3b8; }
        .status { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 16px; }
        
        input[type=range] { width: 100%; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0;">HearLink Balanced</h2>
    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="toggleMic()">START TRANSMISSION</button>
    
    <div class="controls">
        <div class="row">
            <div class="label-group">
                <span class="label-main">Mic Volume (Gain)</span>
                <span class="label-sub" id="gainVal">Current: 0.5x</span>
            </div>
        </div>
        <input type="range" id="gainSlider" min="0.1" max="5.0" step="0.1" value="0.5">
        
        <div class="row">
            <div class="label-group">
                <span class="label-main">Noise Suppression</span>
                <span class="label-sub">Filters background hum</span>
            </div>
            <input type="checkbox" id="noiseOn" checked>
        </div>
        
        <div class="row">
            <div class="label-group">
                <span class="label-main">Echo Cancellation</span>
                <span class="label-sub">Prevents feedback loops</span>
            </div>
            <input type="checkbox" id="echoOn" checked>
        </div>
    </div>
    
    <div class="status" id="statusText">Ready to connect</div>
</div>

<script>
    let audioCtx = null;
    let stream = null;
    let source = null;
    let gainNode = null;
    let analyser = null;
    let isRunning = false;
    let animationId = null;

    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const toggleBtn = document.getElementById('toggleBtn');
    const gainSlider = document.getElementById('gainSlider');
    const gainValDisplay = document.getElementById('gainVal');

    async function toggleMic() {
        if (!isRunning) {
            await startMic();
        } else {
            stopMic();
        }
    }

    async function startMic() {
        try {
            const constraints = {
                audio: {
                    echoCancellation: document.getElementById('echoOn').checked,
                    noiseSuppression: document.getElementById('noiseOn').checked,
                    autoGainControl: false // Manual control is better for hearing aids
                }
            };
            
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                latencyHint: 'interactive',
                sampleRate: 48000
            });

            source = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            // Update gain based on slider BEFORE connecting to output
            updateGain();

            // Connect graph
            source.connect(gainNode);
            gainNode.connect(analyser);
            gainNode.connect(audioCtx.destination);

            isRunning = true;
            toggleBtn.textContent = "STOP TRANSMISSION";
            toggleBtn.className = "btn-stop";
            statusText.textContent = "Live: Routing to Bluetooth";
            
            drawVisualizer();
            gainSlider.oninput = updateGain;

        } catch (err) {
            statusText.textContent = "Error: " + err.message;
        }
    }

    function stopMic() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        cancelAnimationFrame(animationId);
        
        isRunning = false;
        toggleBtn.textContent = "START TRANSMISSION";
        toggleBtn.className = "btn-start";
        statusText.textContent = "Stopped";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateGain() {
        const val = gainSlider.value;
        gainValDisplay.textContent = `Current: ${val}x`;
        if (gainNode && audioCtx) {
            // Smoothly transition the gain to avoid clicks
            gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.015);
        }
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = '#2dd4bf';
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }
</script>
</body>
</html>
