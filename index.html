<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink Ultra - Phone Mic Priority</title>
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --accent: #34d399; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; }
        .container { width: 100%; max-width: 380px; background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid #333; }
        #visualizer { width: 100%; height: 80px; background: #000; border-radius: 15px; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; font-size: 1.2rem; font-weight: 800; border: none; border-radius: 18px; cursor: pointer; transition: 0.2s; }
        .btn-start { background: var(--accent); color: #000; }
        .btn-stop { background: #ff4757; color: #fff; }
        .controls { margin-top: 25px; display: flex; flex-direction: column; gap: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .val-badge { background: #222; padding: 5px 12px; border-radius: 10px; color: var(--accent); font-family: monospace; }
        .status { font-size: 0.8rem; color: #555; text-align: center; margin-top: 20px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; background: #333; accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0 0 15px 0; font-size: 1.4rem; text-align: center;">HearLink <span style="color:var(--accent)">Ultra V4</span></h2>
    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="toggleMic()">ENABLE PHONE MIC</button>
    
    <div class="controls">
        <div>
            <div class="row">
                <span>Phone Mic Gain</span>
                <span class="val-badge" id="gainVal">15%</span>
            </div>
            <input type="range" id="gainSlider" min="0.01" max="2.0" step="0.01" value="0.15">
        </div>

        <div style="background: #111; padding: 12px; border-radius: 12px; font-size: 0.8rem; color: #888;">
            <b>Input Source:</b> <span id="sourceInfo">Auto-selecting Phone Mic...</span>
        </div>
    </div>
    
    <div class="status" id="statusText">System Ready</div>
</div>

<script>
    let audioCtx = null, stream = null, source = null, gainNode = null, filterNode = null, analyser = null;
    let isRunning = false, animationId = null;

    async function getPhoneMicId() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === 'audioinput');
        
        // Look for internal/built-in microphone specifically
        const internalMic = audioInputs.find(d => 
            d.label.toLowerCase().includes('built-in') || 
            d.label.toLowerCase().includes('iphone') || 
            d.label.toLowerCase().includes('android') ||
            d.label.toLowerCase().includes('mic') && !d.label.toLowerCase().includes('bluetooth')
        );

        return internalMic ? internalMic.deviceId : null;
    }

    async function toggleMic() {
        if (!isRunning) {
            try {
                // Request initial permission to see device labels
                await navigator.mediaDevices.getUserMedia({ audio: true });
                const phoneMicId = await getPhoneMicId();
                
                const constraints = {
                    audio: {
                        deviceId: phoneMicId ? { exact: phoneMicId } : undefined,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false,
                        channelCount: 1
                    }
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('sourceInfo').textContent = phoneMicId ? "Phone Internal Mic" : "System Default (Manual Switch Required)";
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                source = audioCtx.createMediaStreamSource(stream);
                
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = "highpass";
                filterNode.frequency.value = 400; 

                gainNode = audioCtx.createGain();
                updateSettings();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;

                source.connect(filterNode);
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.connect(analyser);

                isRunning = true;
                document.getElementById('toggleBtn').textContent = "STOP STREAM";
                document.getElementById('toggleBtn').className = "btn-stop";
                document.getElementById('statusText').textContent = "MODE: ACTIVE";
                drawVisualizer();
                
                document.getElementById('gainSlider').oninput = updateSettings;

            } catch (err) {
                document.getElementById('statusText').textContent = "ERROR: " + err.message;
            }
        } else {
            stopMic();
        }
    }

    function stopMic() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        cancelAnimationFrame(animationId);
        isRunning = false;
        document.getElementById('toggleBtn').textContent = "ENABLE PHONE MIC";
        document.getElementById('toggleBtn').className = "btn-start";
        document.getElementById('statusText').textContent = "MODE: IDLE";
    }

    function updateSettings() {
        const val = parseFloat(document.getElementById('gainSlider').value);
        document.getElementById('gainVal').textContent = Math.round(val * 100) + "%";
        if (gainNode) gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.01);
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = '#34d399';
            ctx.fillRect(i * 12, canvas.height - barHeight, 10, barHeight);
        }
    }
    const ctx_v = canvas.getContext('2d');
</script>
</body>
</html>
