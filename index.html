<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearLink Pro - SNR Optimized</title>
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #00ffcc;
            --text: #ffffff;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #222;
        }
        #visualizer {
            width: 100%;
            height: 100px;
            background: #000;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-start { background: var(--accent); color: #000; }
        .btn-stop { background: #ff4444; color: #fff; }
        .controls { margin-top: 25px; display: flex; flex-direction: column; gap: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .val-badge { background: #222; padding: 4px 10px; border-radius: 8px; color: var(--accent); font-family: monospace; }
        .status { font-size: 0.85rem; color: #666; text-align: center; margin-top: 20px; }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #333; accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color:var(--accent);">HearLink Pro</h2>
    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="toggleMic()">START MIC</button>
    
    <div class="controls">
        <div>
            <div class="row" style="margin-bottom:8px;">
                <span>Mic Sensitivity</span>
                <span class="val-badge" id="gainVal">20%</span>
            </div>
            <input type="range" id="gainSlider" min="0.01" max="2.0" step="0.01" value="0.2">
            <div style="font-size:0.7rem; color:#888; margin-top:5px;">Lower this to reduce the "echo" of your own voice.</div>
        </div>

        <div class="row">
            <span>Speech Clarity (High-Pass)</span>
            <input type="checkbox" id="filterOn" checked>
        </div>
        
        <div class="row">
            <span>Background Noise Filter</span>
            <input type="checkbox" id="noiseOn" checked>
        </div>
    </div>
    
    <div class="status" id="statusText">Ready</div>
</div>

<script>
    let audioCtx = null, stream = null, source = null, gainNode = null, filterNode = null, analyser = null;
    let isRunning = false, animationId = null;

    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggleBtn');
    const gainSlider = document.getElementById('gainSlider');
    const gainValDisplay = document.getElementById('gainVal');

    async function toggleMic() {
        if (!isRunning) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: document.getElementById('noiseOn').checked,
                        autoGainControl: false 
                    }
                });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                source = audioCtx.createMediaStreamSource(stream);
                
                // 1. High Pass Filter (removes 'boomy' own-voice frequencies)
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = "highpass";
                filterNode.frequency.value = 300; // Filter out sounds below 300Hz

                // 2. Gain Node
                gainNode = audioCtx.createGain();
                updateSettings();

                // 3. Analyser
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                // Chain: Source -> Filter -> Gain -> Destination & Analyser
                source.connect(filterNode);
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.connect(analyser);

                isRunning = true;
                toggleBtn.textContent = "STOP MIC";
                toggleBtn.className = "btn-stop";
                document.getElementById('statusText').textContent = "Streaming...";
                drawVisualizer();
                
                gainSlider.oninput = updateSettings;
                document.getElementById('filterOn').onchange = updateSettings;

            } catch (err) {
                alert("Mic access error: " + err.message);
            }
        } else {
            stopMic();
        }
    }

    function stopMic() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        cancelAnimationFrame(animationId);
        isRunning = false;
        toggleBtn.textContent = "START MIC";
        toggleBtn.className = "btn-start";
        document.getElementById('statusText').textContent = "Stopped";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateSettings() {
        const gainVal = parseFloat(gainSlider.value);
        gainValDisplay.textContent = Math.round(gainVal * 100) + "%";
        
        if (gainNode) {
            gainNode.gain.setTargetAtTime(gainVal, audioCtx.currentTime, 0.01);
        }
        
        if (filterNode) {
            const isFilterOn = document.getElementById('filterOn').checked;
            // When filter is off, we set it to a very low frequency so it does nothing
            filterNode.frequency.setTargetAtTime(isFilterOn ? 300 : 10, audioCtx.currentTime, 0.01);
        }
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;
        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }
</script>
</body>
</html>
