<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink V12 - Pure Isolation</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #10b981; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 380px; background: var(--card); padding: 25px; border-radius: 28px; border: 1px solid #1e293b; }
        #visualizer { width: 100%; height: 90px; background: #000; border-radius: 16px; margin-bottom: 20px; border: 1px solid #1e293b; }
        button { width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; margin-bottom: 15px;}
        .btn-start { background: var(--accent); color: #064e3b; }
        .btn-stop { background: #ef4444; color: #fff; }
        .panel { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid #334155; }
        .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #334155; accent-color: var(--accent); cursor: pointer; }
        .status-badge { font-size: 0.7rem; color: var(--accent); background: #064e3b33; padding: 6px 12px; border-radius: 20px; border: 1px solid #064e3b; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center;">
        <h2 style="margin:0 0 5px 0;">HearLink <span style="color:var(--accent)">V12</span></h2>
        <div class="status-badge" id="statusBadge">HARDWARE: PURE PHONE MIC</div>
    </div>

    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="startAbsoluteIsolation()">ACTIVATE PURE MIC</button>
    
    <div class="panel">
        <span class="label">Remote Sensitivity <span style="float:right; color:var(--accent);" id="gainVal">25%</span></span>
        <input type="range" id="masterGain" min="0" max="3.0" step="0.01" value="0.25">
        <div style="font-size: 0.7rem; color: #64748b; line-height: 1.4; margin-top: 12px;">
            <strong>V12 Logic Active:</strong><br>
            • Fixed Canvas Reference Error.<br>
            • Raw Hardware Input: Disabled Browser Echo Cancellation.<br>
            • 450Hz High-Pass: Removes own-voice bass rumble.
        </div>
    </div>
</div>

<script>
    let audioCtx, stream, source, gainNode, filter, analyser;
    let isRunning = false, animationId;
    
    // Globally define canvas and context to avoid "not defined" errors
    const canvas = document.getElementById('visualizer');
    const visualCtx = canvas.getContext('2d');

    async function startAbsoluteIsolation() {
        if (!isRunning) {
            try {
                // 1. Identify Internal Mic exclusively
                const devices = await navigator.mediaDevices.enumerateDevices();
                const internalMic = devices.filter(d => d.kind === 'audioinput').find(d => 
                    !d.label.toLowerCase().includes('bluetooth') && 
                    !d.label.toLowerCase().includes('hands-free')
                );

                // 2. Request RAW Audio
                // Setting echoCancellation to false stops the browser from monitoring 
                // the Bluetooth output to "correct" the input.
                stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        deviceId: internalMic ? { exact: internalMic.deviceId } : undefined,
                        echoCancellation: false, 
                        noiseSuppression: false,
                        autoGainControl: false 
                    } 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                source = audioCtx.createMediaStreamSource(stream);
                
                // 3. Clinical Frequency Shaping
                filter = audioCtx.createBiquadFilter();
                filter.type = "highpass";
                filter.frequency.value = 450; // Increased to 450Hz to further isolate own-voice

                gainNode = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;

                source.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.connect(analyser);

                isRunning = true;
                document.getElementById('toggleBtn').textContent = "STOP SYSTEM";
                document.getElementById('toggleBtn').className = "btn-stop";
                updateGain();
                drawVisualizer();
                document.getElementById('masterGain').oninput = updateGain;

            } catch (err) {
                alert("Hardware Conflict: " + err.message);
            }
        } else {
            location.reload(); // Clean hardware release
        }
    }

    function updateGain() {
        if (!isRunning) return;
        const val = parseFloat(document.getElementById('masterGain').value);
        document.getElementById('gainVal').textContent = Math.round(val * 100) + "%";
        gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.01);
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);
        
        // Use the globally defined visualCtx
        visualCtx.fillStyle = '#020617';
        visualCtx.fillRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < dataArray.length; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            visualCtx.fillStyle = '#10b981';
            visualCtx.fillRect(i * 12, canvas.height - barHeight, 8, barHeight);
        }
    }
</script>
</body>
</html>
