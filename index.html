<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink V14 - CAPD Clarity</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 380px; background: var(--card); padding: 25px; border-radius: 32px; border: 1px solid #1e293b; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #visualizer { width: 100%; height: 100px; background: #000; border-radius: 20px; margin-bottom: 25px; border: 1px solid #334155; }
        button { width: 100%; padding: 20px; font-size: 1.15rem; font-weight: 800; border: none; border-radius: 18px; cursor: pointer; transition: 0.2s; letter-spacing: 0.5px; }
        .btn-start { background: var(--accent); color: #082f49; }
        .btn-stop { background: #f43f5e; color: #fff; }
        .panel { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; margin-top: 25px; display: flex; flex-direction: column; gap: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; }
        .badge { background: #082f49; color: var(--accent); padding: 4px 10px; border-radius: 8px; font-family: monospace; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #334155; accent-color: var(--accent); cursor: pointer; }
        .info-tag { font-size: 0.65rem; color: #94a3b8; line-height: 1.5; padding-top: 10px; border-top: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:15px;">
        <h2 style="margin:0; font-size: 1.5rem;">HearLink <span style="color:var(--accent)">CAPD</span></h2>
        <div style="font-size:0.7rem; background:#0ea5e922; color:#7dd3fc; border:1px solid #0ea5e944; display:inline-block; padding:4px 12px; border-radius:20px; margin-top:8px;">ULTRA-CLARITY MODE</div>
    </div>

    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="initCapdSystem()">START SPEECH FOCUS</button>
    
    <div class="panel">
        <div>
            <div class="row"><span>Speech Intensity</span><span class="badge" id="gainVal">25%</span></div>
            <input type="range" id="masterGain" min="0.01" max="2.0" step="0.01" value="0.25">
        </div>
        <div>
            <div class="row"><span>Consonant Sharpness</span><span class="badge" id="sharpVal">High</span></div>
            <input type="range" id="eqGain" min="0" max="15" step="1" value="10">
        </div>
        <div class="info-tag">
            <strong>CAPD Logic Enabled:</strong><br>
            • Pure-Path Hardware Lock (Internal Mic Only)<br>
            • 500Hz Cut (Removes Background Rumble)<br>
            • 2.5kHz Boost (Enhances Speech Definition)
        </div>
    </div>
</div>

<script>
    let audioCtx, stream, source, eqHigh, eqPeak, dynamics, gainNode, analyser;
    let isRunning = false, animationId;

    async function initCapdSystem() {
        if (isRunning) { location.reload(); return; }
        try {
            // 1. Exclusive Internal Hardware Lock
            const devices = await navigator.mediaDevices.enumerateDevices();
            const phoneMic = devices.find(d => d.kind === 'audioinput' && 
                !d.label.toLowerCase().includes('bluetooth') && 
                !d.label.toLowerCase().includes('hands-free'));

            stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    deviceId: phoneMic ? { exact: phoneMic.deviceId } : undefined,
                    echoCancellation: false, noiseSuppression: true, autoGainControl: false 
                } 
            });

            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            source = audioCtx.createMediaStreamSource(stream);
            
            // 2. Spectral Shaping
            eqHigh = audioCtx.createBiquadFilter();
            eqHigh.type = "highpass";
            eqHigh.frequency.value = 500; // Sharp cut for background noise

            eqPeak = audioCtx.createBiquadFilter();
            eqPeak.type = "peaking";
            eqPeak.frequency.value = 2500; // consonant clarification peak
            eqPeak.Q.value = 1.2;
            eqPeak.gain.value = 10;

            // 3. Temporal Compression
            dynamics = audioCtx.createDynamicsCompressor();
            dynamics.threshold.value = -20;
            dynamics.attack.value = 0.01; // Fast attack for phoneme preservation
            dynamics.release.value = 0.20;

            gainNode = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;

            // Connection Chain: Mic -> SNR Filter -> Peak EQ -> Dynamics -> BT Output
            source.connect(eqHigh);
            eqHigh.connect(eqPeak);
            eqPeak.connect(dynamics);
            dynamics.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.connect(analyser);

            isRunning = true;
            document.getElementById('toggleBtn').textContent = "STOP & RESET";
            document.getElementById('toggleBtn').className = "btn-stop";
            
            updateUI();
            drawVisualizer();
            document.getElementById('masterGain').oninput = updateUI;
            document.getElementById('eqGain').oninput = updateUI;

        } catch (err) {
            alert("Hardware Error: " + err.message);
        }
    }

    function updateUI() {
        if (!isRunning) return;
        const g = parseFloat(document.getElementById('masterGain').value);
        const s = parseFloat(document.getElementById('eqGain').value);
        gainNode.gain.setTargetAtTime(g, audioCtx.currentTime, 0.01);
        eqPeak.gain.setTargetAtTime(s, audioCtx.currentTime, 0.01);
        document.getElementById('gainVal').textContent = Math.round(g * 100) + "%";
        document.getElementById('sharpVal').textContent = s > 10 ? "Ultra" : (s > 5 ? "High" : "Low");
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < data.length; i++) {
            const h = (data[i] / 255) * canvas.height;
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(i * 3, canvas.height - h, 2, h);
        }
    }
</script>
</body>
</html>
