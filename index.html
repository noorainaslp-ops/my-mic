<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink V7 - Absolute Isolation</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #10b981; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 380px; background: var(--card); padding: 25px; border-radius: 28px; border: 1px solid #1e293b; }
        #visualizer { width: 100%; height: 90px; background: #000; border-radius: 16px; margin-bottom: 20px; border: 1px solid #1e293b; }
        button { width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; margin-bottom: 15px;}
        .btn-start { background: var(--accent); color: #064e3b; }
        .btn-stop { background: #ef4444; color: #fff; }
        .mixer-panel { background: #1e293b; padding: 15px; border-radius: 18px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #334155; }
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 500;}
        .val-badge { color: var(--accent); font-family: ui-monospace, monospace; font-weight: bold; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #334155; accent-color: var(--accent); cursor: pointer; }
        .status-box { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-top: 15px; padding: 10px; background: #020617; border-radius: 10px; border: 1px solid #1e293b;}
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0 0 15px 0; font-size: 1.3rem; text-align: center;">HearLink <span style="color:var(--accent)">V7 Absolute</span></h2>
    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="toggleSystem()">INITIALIZE V7 SYSTEM</button>
    
    <div class="mixer-panel">
        <div style="font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px;">Microphone Priority Mixer</div>
        <div class="row">
            <span>BT Mic (Disabled)</span>
            <span>Phone Mic (Isolated)</span>
        </div>
        <input type="range" id="mixRatio" min="0" max="1" step="0.01" value="1">
        <div class="row" style="margin-top:-5px;">
            <span id="btLabel" class="val-badge">0%</span>
            <span id="phoneLabel" class="val-badge">100%</span>
        </div>

        <div style="margin-top:10px;">
            <div class="row">
                <span>Clinical Gain</span>
                <span class="val-badge" id="masterVal">15%</span>
            </div>
            <input type="range" id="masterGain" min="0.01" max="1.5" step="0.01" value="0.15">
        </div>
    </div>
    
    <div id="statusText" class="status-box">SYSTEM IDLE - PAIR BT DEVICE FIRST</div>
</div>

<script>
    let audioCtx, phoneStream, btStream;
    let phoneSource, btSource, phoneGain, btGain, masterGainNode, analyser;
    let isRunning = false, animationId;

    const visualCtx = document.getElementById('visualizer').getContext('2d');

    async function toggleSystem() {
        if (!isRunning) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const inputs = devices.filter(d => d.kind === 'audioinput');

                // Logic to find Phone Mic vs BT Mic
                const phoneId = inputs.find(d => d.label.toLowerCase().includes('built-in') || d.label.toLowerCase().includes('phone'))?.deviceId;
                const btId = inputs.find(d => d.label.toLowerCase().includes('bluetooth') || d.label.toLowerCase().includes('hands-free'))?.deviceId;

                // 1. Phone Mic Track
                phoneStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { deviceId: phoneId ? { exact: phoneId } : undefined, echoCancellation: true, autoGainControl: false } 
                });
                phoneSource = audioCtx.createMediaStreamSource(phoneStream);
                phoneGain = audioCtx.createGain();
                phoneSource.connect(phoneGain);

                // 2. Bluetooth Mic Track (Only request if found)
                if (btId) {
                    btStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: btId } } });
                    btSource = audioCtx.createMediaStreamSource(btStream);
                    btGain = audioCtx.createGain();
                    btSource.connect(btGain);
                }

                // 3. Clinical Signal Chain (ANSD Optimized)
                const hpFilter = audioCtx.createBiquadFilter();
                hpFilter.type = "highpass";
                hpFilter.frequency.value = 400; // Cut own-voice low-end boom

                masterGainNode = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64; 

                if (phoneGain) phoneGain.connect(hpFilter);
                if (btGain) btGain.connect(hpFilter);

                hpFilter.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.connect(analyser);

                isRunning = true;
                document.getElementById('toggleBtn').textContent = "STOP ISOLATION";
                document.getElementById('toggleBtn').className = "btn-stop";
                updateMix();
                drawVisualizer();

                document.getElementById('mixRatio').oninput = updateMix;
                document.getElementById('masterGain').oninput = updateMix;

            } catch (err) {
                alert("Hardware Sync Error: " + err.message);
            }
        } else {
            stopSystem();
        }
    }

    function updateMix() {
        if (!isRunning) return;
        const mix = parseFloat(document.getElementById('mixRatio').value); 
        const master = parseFloat(document.getElementById('masterGain').value);
        
        // PHYSICAL TRACK DISABLE: If phone is 100%, we physically stop the BT mic track
        if (btStream) {
            btStream.getAudioTracks().forEach(track => {
                track.enabled = (mix < 0.95); // Disable track if focus is on phone
            });
        }

        const phoneVol = mix;
        const btVol = mix > 0.95 ? 0 : (1 - mix);

        if (phoneGain) phoneGain.gain.setTargetAtTime(phoneVol, audioCtx.currentTime, 0.01);
        if (btGain) btGain.gain.setTargetAtTime(btVol, audioCtx.currentTime, 0.01);
        masterGainNode.gain.setTargetAtTime(master, audioCtx.currentTime, 0.01);

        document.getElementById('phoneLabel').textContent = Math.round(phoneVol * 100) + "%";
        document.getElementById('btLabel').textContent = Math.round(btVol * 100) + "%";
        document.getElementById('masterVal').textContent = Math.round(master * 100) + "%";
        
        document.getElementById('statusText').textContent = mix > 0.95 ? "TRACK STATUS: BT MIC HARD-MUTED" : "TRACK STATUS: MIXING ACTIVE";
    }

    function stopSystem() {
        location.reload(); // Force hardware release
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);
        visualCtx.fillStyle = '#020617';
        visualCtx.fillRect(0, 0, visualCtx.canvas.width, visualCtx.canvas.height);
        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * visualCtx.canvas.height;
            visualCtx.fillStyle = '#10b981';
            visualCtx.fillRect(i * 12, visualCtx.canvas.height - barHeight, 8, barHeight);
        }
    }
</script>
</body>
</html>
