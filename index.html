<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink V8 - Pure Phone Mic</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #10b981; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 380px; background: var(--card); padding: 25px; border-radius: 28px; border: 1px solid #1e293b; }
        #visualizer { width: 100%; height: 90px; background: #000; border-radius: 16px; margin-bottom: 20px; border: 1px solid #1e293b; }
        button { width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; margin-bottom: 15px;}
        .btn-start { background: var(--accent); color: #064e3b; }
        .btn-stop { background: #ef4444; color: #fff; }
        .status-box { font-size: 0.8rem; color: #94a3b8; text-align: center; padding: 12px; background: #020617; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 20px;}
        .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #334155; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0 0 15px 0; font-size: 1.3rem; text-align: center;">HearLink <span style="color:var(--accent)">V8 Pure Mic</span></h2>
    <canvas id="visualizer"></canvas>
    
    <div id="statusText" class="status-box">Tap Start to Search for Internal Mic</div>

    <button id="toggleBtn" class="btn-start" onclick="startPurePhoneMic()">START PURE MIC MODE</button>
    
    <div style="background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid #334155;">
        <span class="label">Volume Control</span>
        <input type="range" id="masterGain" min="0.01" max="2.0" step="0.01" value="0.25">
        <div style="display:flex; justify-content: space-between; margin-top: 5px; font-family: monospace; font-size: 0.8rem; color: var(--accent);">
            <span>0%</span>
            <span id="gainVal">25%</span>
            <span>200%</span>
        </div>
    </div>
</div>

<script>
    let audioCtx, phoneStream, phoneSource, masterGainNode, analyser;
    let isRunning = false, animationId;

    const visualCtx = document.getElementById('visualizer').getContext('2d');
    const statusBox = document.getElementById('statusText');

    async function startPurePhoneMic() {
        if (!isRunning) {
            try {
                // 1. Enumerate all devices to find the internal mic
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                
                // Specifically look for labels that do NOT contain bluetooth/hands-free
                const internalMic = audioInputs.find(d => 
                    (d.label.toLowerCase().includes('built-in') || d.label.toLowerCase().includes('mic')) && 
                    !d.label.toLowerCase().includes('bluetooth') && 
                    !d.label.toLowerCase().includes('hands-free')
                );

                if (!internalMic && audioInputs.length > 0) {
                    statusBox.textContent = "Warning: Internal mic label not found. Using default.";
                }

                // 2. Request ONLY the internal mic ID
                const constraints = {
                    audio: {
                        deviceId: internalMic ? { exact: internalMic.deviceId } : undefined,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false // Prevents the phone from 'boosting' your own voice
                    }
                };
                
                phoneStream = await navigator.mediaDevices.getUserMedia(constraints);
                statusBox.innerHTML = `Connected to: <br><strong>${internalMic ? internalMic.label : 'System Default Mic'}</strong>`;

                // 3. Audio Processing
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                phoneSource = audioCtx.createMediaStreamSource(phoneStream);
                
                // ANSD Strategy: High-pass filter to remove the "boomy" own-voice effect
                const hpFilter = audioCtx.createBiquadFilter();
                hpFilter.type = "highpass";
                hpFilter.frequency.value = 450; 

                masterGainNode = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64; 

                phoneSource.connect(hpFilter);
                hpFilter.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.connect(analyser);

                isRunning = true;
                document.getElementById('toggleBtn').textContent = "STOP MIC";
                document.getElementById('toggleBtn').className = "btn-stop";
                
                updateGain();
                drawVisualizer();
                document.getElementById('masterGain').oninput = updateGain;

            } catch (err) {
                statusBox.textContent = "Error: " + err.message;
            }
        } else {
            location.reload(); // Hard reset to release hardware
        }
    }

    function updateGain() {
        if (!isRunning) return;
        const val = parseFloat(document.getElementById('masterGain').value);
        document.getElementById('gainVal').textContent = Math.round(val * 100) + "%";
        masterGainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.01);
    }

    function drawVisualizer() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(drawVisualizer);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);
        visualCtx.fillStyle = '#020617';
        visualCtx.fillRect(0, 0, visualCtx.canvas.width, visualCtx.canvas.height);
        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * visualCtx.canvas.height;
            visualCtx.fillStyle = '#10b981';
            visualCtx.fillRect(i * 12, visualCtx.canvas.height - barHeight, 8, barHeight);
        }
    }
</script>
</body>
</html>
